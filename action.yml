name: Shipcast
description: Launch a GitHub project on its release (analyse it with Claude, draft the content pack as a pull request), and publish it after the owner approves
author: Jose Antonio Garrido
branding:
  icon: send
  color: blue

# Composite: installs Node and Shipcast, then runs `shipcast ci` (docs/decisions/action-mode.md). The
# networks' credentials are not inputs: give them as `env:` on the step that uses this action, under
# the names .env.example uses (DEVTO_API_KEY, BLUESKY_HANDLE, ...), as templates/shipcast-publish.yml does.
inputs:
  command:
    description: "launch (claim a release and draft it), publish (a merged drafts pull request) or round (whatever is ready)"
    required: true
  launches-repo:
    description: The launches repo, owner/name, where the drafts pull requests and the state branch live
    required: true
  github-app-id:
    description: The GitHub App's id (recommended); with github-app-private-key, the run mints its own installation token
    required: false
    default: ""
  github-app-client-id:
    description: The GitHub App's client id, which GitHub recommends as the JWT's issuer
    required: false
    default: ""
  github-app-private-key:
    description: The GitHub App's private key (PEM), from a secret
    required: false
    default: ""
  github-token:
    description: A token that can read the project repo and write the launches repo (for example from actions/create-github-app-token). Without any, GITHUB_TOKEN is the fallback, which only reaches this workflow's own repo
    required: false
    default: ""
  anthropic-api-key:
    description: The Anthropic API key the content pack is written with (launch, and round with detect)
    required: false
    default: ""
  ai-model:
    description: The model; Claude Opus by default with the Anthropic API, required with ai-base-url
    required: false
    default: ""
  ai-base-url:
    description: An OpenAI-compatible server to write with instead of the Anthropic API
    required: false
    default: ""
  ai-api-key:
    description: The key of that server
    required: false
    default: ""
  database-url:
    description: A Postgres of your own as the registry (postgres://...), instead of the shipcast-state branch
    required: false
    default: ""
  repo:
    description: "launch: the repo to launch by hand, owner/name (the workflow's own repo on workflow_dispatch)"
    required: false
    default: ""
  ref:
    description: "launch: the release's tag to launch by hand (the latest release without one)"
    required: false
    default: ""
  pull-request:
    description: "publish: the merged drafts pull request's URL (the workflow's pull_request event without one)"
    required: false
    default: ""
  detect:
    description: "round: also poll the brand's public events for releases no workflow claimed"
    required: false
    default: "false"
  wait-minutes:
    description: "publish: how long to wait for the blog to deploy before leaving it to the next round"
    required: false
    default: "20"
  dry-run:
    description: Print what would be done; nothing is saved, asked of the AI, opened or posted
    required: false
    default: "false"
outputs:
  status:
    description: "drafted, already-launched, ignored, failed, dry-run (launch); published, waiting, nothing (publish); done (round)"
    value: ${{ steps.shipcast.outputs.status }}
  launch-id:
    description: The launch's id in the registry
    value: ${{ steps.shipcast.outputs.launch-id }}
  pull-request:
    description: The drafts pull request's URL, when one was opened
    value: ${{ steps.shipcast.outputs.pull-request }}
  claimed:
    description: "round: how many releases it claimed"
    value: ${{ steps.shipcast.outputs.claimed }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        package_json_file: ${{ github.action_path }}/package.json
    - uses: actions/setup-node@v7
      with:
        # The version Shipcast is pinned to (.nvmrc): `ci` runs TypeScript directly, which needs it
        node-version: 24.22.1
    - name: Install Shipcast
      shell: bash
      # Only the CLI and what it imports, not the web app's tree
      run: pnpm install --frozen-lockfile --filter "@shipcast/cli..." --dir "$GITHUB_ACTION_PATH"
    - name: shipcast ci
      id: shipcast
      shell: bash
      env:
        # The caller's own GITHUB_TOKEN stays the last fallback: it is set only when no other is given
        GITHUB_TOKEN: ${{ github.token }}
        SHIPCAST_LAUNCHES_REPO: ${{ inputs.launches-repo }}
        SHIPCAST_GITHUB_APP_ID: ${{ inputs.github-app-id }}
        SHIPCAST_GITHUB_APP_CLIENT_ID: ${{ inputs.github-app-client-id }}
        SHIPCAST_GITHUB_APP_PRIVATE_KEY: ${{ inputs.github-app-private-key }}
        SHIPCAST_GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        SHIPCAST_AI_MODEL: ${{ inputs.ai-model }}
        SHIPCAST_AI_BASE_URL: ${{ inputs.ai-base-url }}
        SHIPCAST_AI_API_KEY: ${{ inputs.ai-api-key }}
        SHIPCAST_DATABASE_URL: ${{ inputs.database-url }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_PULL_REQUEST: ${{ inputs.pull-request }}
        INPUT_DETECT: ${{ inputs.detect }}
        INPUT_WAIT: ${{ inputs.wait-minutes }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        # Inputs reach the shell as variables, never spliced into the script, so a tag or a title
        # cannot inject a command
        args=("$INPUT_COMMAND")
        [ "$INPUT_DRY_RUN" = "true" ] && args+=(--dry-run)
        case "$INPUT_COMMAND" in
          launch)
            [ -n "$INPUT_REPO" ] && args+=(--repo "$INPUT_REPO")
            [ -n "$INPUT_REF" ] && args+=(--ref "$INPUT_REF")
            ;;
          publish)
            [ -n "$INPUT_PULL_REQUEST" ] && args+=(--pull-request "$INPUT_PULL_REQUEST")
            args+=(--wait "$INPUT_WAIT")
            ;;
          round)
            [ "$INPUT_DETECT" = "true" ] && args+=(--detect)
            ;;
        esac
        exec node "$GITHUB_ACTION_PATH/apps/cli/src/main.ts" ci "${args[@]}"
