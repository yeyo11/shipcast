# The brand this launches repo publishes for. Shipcast reads it (its brand schema lives in
# yeyo11/shipcast, packages/schema) to sign the content, pick each channel's language and tone, and
# link the profiles. Public information only: tokens stay in Shipcast's .env.
id: personal
displayName: José Antonio Garrido
github: yeyo11

handles:
  bluesky: https://bsky.app/profile/yeyo11.bsky.social
  mastodon: https://mastodon.social/@yeyo11
  devto: https://dev.to/yeyo11
  reddit: https://www.reddit.com/user/josegarridodev/
  instagram: https://www.instagram.com/josegarridodev

# Where readers can support the author; linked from the blog's footer. Optional.
support: https://buymeacoffee.com/yeyo11

# Cookieless visit counting for the site. The token is public: it ships in every page.
analytics:
  cloudflareWebAnalytics: 92f225058e744da9ac04fe51a7cab5a5

# The blog is written in both; the other channels default to English.
languages:
  blog: [en, es]

# How the AI writes for this brand. Refine it with real published launches.
tone: >
  Write as a developer telling other developers what they built, in the first person and talking
  to the reader directly (tú in Spanish, you in English). Lead with the concrete problem in one
  sentence, then teach: say what the reader will get, and for each feature give one sentence on
  what it does, a short code block or command, and a line on how it works or what to watch out
  for. Show evidence (the exact command, config or output), never vague claims, and say plainly
  what does not work yet. Practical, direct, no filler: no hype, no superlatives, no marketing
  words. Articles are calm and didactic, without emojis or exclamation marks. Social posts open
  with a hook that states the useful thing, stay short and energetic, and may use a few emojis
  as markers, never as decoration. Spanish is from Spain.
