# Sluice repository configuration, written by `sluice init`.
# Commit it: the gates are shared by everyone who works on this repository.
# weight: a number is a ceiling in budget units (roughly the CPU threads the
# gate uses); "auto" starts at half the daemon budget and learns a lower
# weight from measured runs (needs Sluice 0.4.0). An omitted weight means 1.
version = 1

[defaults]
agent_hook_policy = "fail-fast"   # fail-fast | wait | run-unqueued
human_hook_policy = "wait"        # wait | run-unqueued
tail_lines = 40

# Detected at the root: node (pnpm).

[gates.typecheck]
cmd = "pnpm run typecheck"
weight = 2
timeout = "10m"
hooks = ["pre-commit"]
key_inputs = ["node --version", "pnpm --version"]

[gates.test]
# Each package's own test command with at most six test files at once: the suite grew to a 15 GiB peak
# with node's default (a worker per core), which no longer fit beside a working desktop
cmd = "pnpm -r --workspace-concurrency=1 exec node --test --test-concurrency=6 \"test/**/*.test.ts\""
weight = "auto"
timeout = "30m"
hooks = ["pre-push"]
key_inputs = ["node --version", "pnpm --version"]
# One package at a time: `pnpm -r test` runs up to four packages at once and each `node --test`
# starts a worker per core (1.5-2.7 GiB each); together they peaked at 18 GiB on a 30 GiB machine
# and the kernel killed other processes. One package at a time keeps the suite near one package's peak
env = { CI = "1", npm_config_workspace_concurrency = "1" }

[queue]
# A merge train verifies in a fresh worktree without node_modules: install once, before the gates
# (Sluice 0.6.0; a failure is attributed by installing the target alone)
prepare = "pnpm install --frozen-lockfile --prefer-offline"
