name: Bug report
description: Something behaves differently from what the docs say.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a `.github/launch.yml` with …
        2. Publish a release
        3. The drafts pull request never opens
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Shipcast version or commit
    validations:
      required: true

  - type: textarea
    id: launch-yml
    attributes:
      label: Your launch.yml
      description: The repo's `.github/launch.yml`, if the bug concerns a launch.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact every token and API key before pasting.
      render: shell
