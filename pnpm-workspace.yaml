packages:
  - "packages/*"
  - "apps/*"
onlyBuiltDependencies:
  - esbuild
useNodeVersion: 24.22.1

# satori pins a fflate with GHSA-px8p-9vwx-vf98 (an infinite loop on malformed ZIP64); the fix is a patch release
overrides:
  fflate: ^0.7.5

# acme-client pulls node-forge, whose RSA PKCS#1 v1.5 signature verification has GHSA-86w9-cpqp-85rv
# and no fixed release. Shipcast never verifies signatures with forge: apps/web/tls.ts uses
# acme.crypto (Node's own crypto, ECDSA keys), not acme.forge. Drop this when acme-client leaves forge.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
