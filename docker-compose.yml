# What the engine needs beside it: claudio, Shipcast's AI provider (https://github.com/yeyo11/claudio),
# as an instance of its own, and the Postgres the launch registry lives in:
#
#   docker compose up -d
#
# Then sign in to Claude once: `docker compose exec claudio claudio login` (docs/claudio.md); the
# headless image has no web UI. The engine runs on the host and reaches claudio at SHIPCAST_CLAUDIO_URL
# and Postgres at SHIPCAST_DATABASE_URL.
name: shipcast # volumes are shipcast_*, whatever folder this is started from

services:
  claudio:
    # Pinned: the engine is written against this API. Move it on purpose, and check docs/claudio.md
    image: ghcr.io/yeyo11/claudio:0.11.0-headless
    init: true # reaps the claude child processes
    # Only what claudio needs: an env_file would hand it every Shipcast secret (GitHub, networks)
    environment:
      CLAUDIO_AUTH_MODE: token
      CLAUDIO_AUTH_TOKEN: ${SHIPCAST_CLAUDIO_TOKEN:?set SHIPCAST_CLAUDIO_TOKEN in .env (openssl rand -hex 32)}
      # Required by the headless profile: claudio refuses to start without a daily ceiling
      CLAUDIO_DAILY_SPEND_CAP_USD: ${CLAUDIO_DAILY_SPEND_CAP_USD:-100}
    ports:
      # Loopback only. 8798, not claudio's 8797, so it can run beside a desktop or dev claudio
      - "127.0.0.1:${CLAUDIO_PORT:-8798}:8797"
    volumes:
      - claude-config:/home/node/.claude # Claude Code's account and settings
      - claudio-data:/data # claudio's store, credential and sign-ins
      # The repos Shipcast clones to analyse: the engine writes them here, claudio reads them in
      # /workspace. Gitignored
      - ./workspace:/workspace
    restart: unless-stopped
    stop_grace_period: 30s # time for SIGTERM to stop the chats and close the store

  postgres:
    # Pinned to a major: a new major needs a dump and a restore, never just a newer image
    image: postgres:17
    # The credentials the database is created with on its first start; SHIPCAST_DATABASE_URL must
    # carry the same. Only reachable from this machine, so the defaults are safe as they are
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shipcast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shipcast}
      POSTGRES_DB: ${POSTGRES_DB:-shipcast}
    ports:
      # Loopback only. 5433, not 5432, so it can run beside a Postgres of the machine's own
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data # the registry: launches, posts, accounts, metrics
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 30s # time for a clean shutdown, so the next start needs no recovery

volumes:
  claude-config:
  claudio-data:
  postgres-data:
